# Traces the tram and metro Line 1 routes along OpenStreetMap rails (scripts/make_rail.py)
# and commits viewer/rail.json. Runs monthly and on demand (Actions tab -> Run workflow).
name: Update rail tracks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"   # 03:17 UTC on the 1st of each month

permissions:
  contents: write
  actions: write

jobs:
  rail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace routes along the tracks
        run: python3 scripts/make_rail.py
      - name: Commit if changed, then republish the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- viewer/rail.json && git ls-files --error-unmatch viewer/rail.json >/dev/null 2>&1; then
            echo "No change."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/rail.json
          git commit -m "Update rail.json: tram and Line 1 routes traced along OSM tracks" \
                     -m "Generated by scripts/make_rail.py from OpenStreetMap (ODbL) and athens-transit-rt."
          git push
          # Pushes made with the workflow token don't trigger other workflows, so start Pages here.
          gh workflow run pages.yml --ref main
